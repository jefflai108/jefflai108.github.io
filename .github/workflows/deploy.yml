name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Rebuilds on its own so the GitHub contribution graph and the Google Scholar
  # figures stay current without anyone pushing. Both are re-fetched by the
  # `prebuild` step on every run. 06:00 UTC each Monday.
  schedule:
    - cron: '0 6 * * 1'
  # And an on-demand rebuild from the Actions tab.
  workflow_dispatch:

permissions:
  # `write` so the scheduled run can commit the refreshed data snapshot back.
  # That commit is what keeps this workflow alive — see "Keep alive" below.
  contents: write
  pages: write
  id-token: write

# Let one deploy finish rather than cancelling it mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # NOTE: this step does NOT switch the Pages source. `enablement: true`
      # only fires when no Pages site exists at all — on a repo already serving
      # from a branch it is a silent no-op. The source must be set to
      # "GitHub Actions" once, out of band; see README → Deploying.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - run: npm ci
      - run: npm test

      - name: Build
        run: npm run build
        env:
          # Used by scripts/fetch-contributions.mjs to refresh the activity graph.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keep the complete TTS listening set outside Git and verify every MP3.
      - name: Install TTS benchmark audio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_tts_assets.py'
          gh release download tts-v3-benchmark-2026-09-25 \
            --pattern tts-v3-benchmark-2026-09-25.zip \
            --dir "$RUNNER_TEMP/tts-benchmark-assets"
          python3 scripts/install-tts-assets.py \
            "$RUNNER_TEMP/tts-benchmark-assets/tts-v3-benchmark-2026-09-25.zip" dist
          gh release download tts-v3-benchmark-en-2026-09-25 \
            --pattern tts-v3-benchmark-en-2026-09-25.zip \
            --dir "$RUNNER_TEMP/tts-benchmark-assets"
          python3 scripts/install-tts-assets.py \
            "$RUNNER_TEMP/tts-benchmark-assets/tts-v3-benchmark-en-2026-09-25.zip" dist \
            --manifest scripts/tts-benchmark-en-assets.json

      # Generated JPEGs live in a release asset, never in the Git history.
      # Both the archive and every extracted image are pinned by SHA-256.
      - name: Install image comparison assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_image_comparison_assets.py'
          gh release download image-comparison-2026-09-11 \
            --pattern line-image-comparison-images.zip \
            --dir "$RUNNER_TEMP/image-comparison-assets"
          python3 scripts/install-image-comparison-assets.py \
            "$RUNNER_TEMP/image-comparison-assets/line-image-comparison-images.zip" dist

      # A stable release manifest points to an immutable metadata-only snapshot.
      # Verify its namespace, inventory and hashes before adding it to Pages.
      - name: Install TaiwanCorpus Discovery
        run: |
          python3 -m unittest discover -s scripts -p 'test_taiwan_corpus_assets.py'
          python3 scripts/install-taiwan-corpus-assets.py dist

      # Keep generated benchmark pixels outside Git; verify the pinned archive
      # and each JPEG with the same installer used by the image comparison.
      - name: Install LINE delegation benchmark images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download line-delegation-benchmark-2026-09-23 \
            --pattern line-delegation-images.zip \
            --dir "$RUNNER_TEMP/line-delegation-assets"
          python3 scripts/install-image-comparison-assets.py \
            "$RUNNER_TEMP/line-delegation-assets/line-delegation-images.zip" dist \
            --manifest scripts/line-delegation-assets.json

      # V3 has separate namespaced assets for each immutable measured cohort.
      - name: Install LINE v3 delegation benchmark images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download line-v3-delegation-benchmark-2026-09-24 \
            --pattern line-v3-delegation-images.zip \
            --dir "$RUNNER_TEMP/line-v3-delegation-assets"
          python3 scripts/install-image-comparison-assets.py \
            "$RUNNER_TEMP/line-v3-delegation-assets/line-v3-delegation-images.zip" dist \
            --manifest scripts/line-v3-delegation-assets.json

      # Preserve historical pixels; install this comparison's separate namespace
      # from a release archive with a pinned inventory and per-image hashes.
      - name: Install LINE Hermes comparison images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download line-hermes-comparison-2026-09-24 \
            --pattern line-hermes-comparison-images.zip \
            --dir "$RUNNER_TEMP/line-hermes-comparison-assets"
          python3 scripts/install-image-comparison-assets.py \
            "$RUNNER_TEMP/line-hermes-comparison-assets/line-hermes-comparison-images.zip" dist \
            --manifest scripts/line-hermes-comparison-assets.json

      # Older shared pages redirect; old download URLs retain the exact bytes.
      - name: Preserve previously shared LINE v2 URLs
        run: python3 scripts/install-line-v2-redirects.py dist

      # Keep alive.
      #
      # GitHub disables scheduled workflows in a PUBLIC repo "when no repository
      # activity has occurred in 60 days". This site can easily go two months
      # without a push, at which point the cron would be switched off silently
      # and the contribution graph would freeze with no visible error.
      #
      # So the scheduled run commits its own refreshed snapshot back. That is a
      # real commit on master, so the inactivity clock restarts every week and
      # the workflow never ages out. It also keeps the committed JSON current,
      # which matters because it is the fallback whenever a fetch is blocked
      # (Google Scholar 403s CI, so scholar.json only moves when refreshed from
      # a machine Google will talk to).
      #
      # [skip ci] stops this commit from triggering another deploy. Pushes made
      # with GITHUB_TOKEN do not start new workflow runs anyway, so this is a
      # belt-and-braces guard against a loop.
      - name: Persist refreshed data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet -- src/data/; then
            echo "No change to src/data/ — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/
          git commit -m "chore: refresh contribution + citation data [skip ci]"
          git push
          echo "Committed refreshed data; the 60-day inactivity clock is reset."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
