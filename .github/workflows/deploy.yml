name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Rebuilds on its own so the GitHub contribution graph and the Google Scholar
  # figures stay current without anyone pushing. Both are re-fetched by the
  # `prebuild` step on every run. 06:00 UTC each Monday.
  schedule:
    - cron: '0 6 * * 1'
  # And an on-demand rebuild from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deploy finish rather than cancelling it mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # NOTE: this step does NOT switch the Pages source. `enablement: true`
      # only fires when no Pages site exists at all — on a repo already serving
      # from a branch it is a silent no-op. The source must be set to
      # "GitHub Actions" once, out of band; see README → Deploying.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Used by scripts/fetch-contributions.mjs to refresh the activity graph.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
