<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 480" role="img" aria-labelledby="title desc"><title id="title">受控失敗恢復（注入故障） · 前景互動</title><desc id="desc">橫軸是題目順序，縱軸是秒數，每色一個版本；圓點為任務完成檢查通過，叉號為未完成或尚未確認。時間包括所有重試與失敗嘗試。缺少時間不畫成零，離群值完整保留。</desc><rect width="100%" height="100%" fill="#fff"/><g font-family="system-ui, sans-serif" fill="#21372f"><text x="24" y="30" font-size="20" font-weight="700">受控失敗恢復（注入故障） · 前景互動</text><text x="24" y="54" font-size="12">共同完成題的完整嘗試時間（含重試） · 0/2 題；未記錄時間不畫點</text><circle cx="24" cy="80" r="4" fill="#2965a2"/><text x="34" y="84" font-size="11">v1</text><circle cx="404" cy="80" r="4" fill="#d06b23"/><text x="414" y="84" font-size="11">v2</text><circle cx="784" cy="80" r="4" fill="#309367"/><text x="794" y="84" font-size="11">v2 + follow-up</text><circle cx="24" cy="104" r="4" fill="#9461b5"/><text x="34" y="108" font-size="11">v3 (Hermes, gpt-6-sol)</text><circle cx="404" cy="104" r="4" fill="#cc4c6a"/><text x="414" y="108" font-size="11">v3 (Hermes, gemini-3.8-flash medium)</text><path d="M76 405.0H1128" stroke="#e0e7e2"/><text x="64" y="409.0" text-anchor="end" font-size="11">0.0</text><path d="M76 353.0H1128" stroke="#e0e7e2"/><text x="64" y="357.0" text-anchor="end" font-size="11">0.2</text><path d="M76 301.0H1128" stroke="#e0e7e2"/><text x="64" y="305.0" text-anchor="end" font-size="11">0.4</text><path d="M76 249.0H1128" stroke="#e0e7e2"/><text x="64" y="253.0" text-anchor="end" font-size="11">0.7</text><path d="M76 197.0H1128" stroke="#e0e7e2"/><text x="64" y="201.0" text-anchor="end" font-size="11">0.9</text><path d="M76 145.0H1128" stroke="#e0e7e2"/><text x="64" y="149.0" text-anchor="end" font-size="11">1.1</text><path d="M339.0 145V405" stroke="#f1f4f1"/><text x="339.0" y="426" text-anchor="middle" font-size="11">1</text><path d="M865.0 145V405" stroke="#f1f4f1"/><text x="865.0" y="426" text-anchor="middle" font-size="11">2</text><text x="602.0" y="453" text-anchor="middle" font-size="12">題目順序（turn）；題號見各點提示</text><text x="18" y="275" text-anchor="middle" font-size="12" transform="rotate(-90 18 275)">延遲（秒）</text><text x="1128" y="472" text-anchor="end" fill="#65766e" font-size="10">圓點：任務完成 · 叉號：未完成／未確認 · 0 個時間未記錄</text><text x="90" y="180" font-size="14">尚無符合條件的量測資料。</text></g></svg>